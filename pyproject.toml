[project]
name = "murchace"
version = "0.0.2"
description = "Slick Serving Experience powered by Server-Sent Events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "python-multipart>=0.0.32",
    "databases[aiosqlite]>=0.9.0",
    "doit>=0.37.0",
    "alembic>=1.18.5",
    "datastar-py>=1.0.2",
    "htpy>=26.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "inline-snapshot>=0.35.3",
    "ty>=0.0.65",
    "ruff>=0.16.0",
    "sqlparse>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/app"]

[tool.doit]
backend = "sqlite3"
dep_file = ".doit.db"

[tool.doit.commands.list]
status = true
subtasks = true
sort = "definition"

[tool.ruff]
exclude = ["db/env.py", "db/versions"]

[tool.ty]
